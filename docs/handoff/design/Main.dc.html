<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Сирники — рецепт</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#4A4A48}a:hover{color:#1F1F1E}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hov{opacity:0;transition:opacity .18s ease}
@media (hover:hover){.zone:hover .hov{opacity:1}}
@media (hover:none){.tch{opacity:1}}
.zone:focus-within .hov,.reveal .hov{opacity:1}
.ghost{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:#5E5E5B;font:inherit;font-size:14px;text-decoration:none;cursor:pointer}
.ghost:hover{background:#F2F2F0;color:#1F1F1E}
.icon{width:44px;padding:0;justify-content:center}
.round{width:32px;height:32px;min-height:32px;padding:0;justify-content:center;border-radius:50%;border:1px solid #E4E4E1}
.pill{display:inline-flex;align-items:center;min-height:40px;padding:0 18px;border:0;border-radius:999px;color:#2B2B2A;font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.ing{width:100%;display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:11px 8px;border:0;border-radius:8px;background:transparent;font:inherit;color:#2B2B2A;text-align:left;cursor:pointer}
.ing:hover{background:#F6F6F4}
.done{text-decoration:line-through;color:#6B6B69}
.thumb{position:relative;width:64px;height:64px;border:0;border-radius:10px;cursor:pointer;padding:0}
.thumb.on{box-shadow:0 0 0 2px #FFFFFF,0 0 0 4px #2B2B2A}
.sp{width:104px;height:78px;border:0;border-radius:10px;padding:0;cursor:zoom-in;transition:width .25s ease,height .25s ease}
.sp.big{width:100%;height:220px;cursor:zoom-out}
.tag{display:inline-flex;align-items:center;gap:2px;min-height:28px;padding:0 12px;border-radius:999px;font-size:13px;color:#2B2B2A}
.tag-x{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;margin-right:-6px;border:0;border-radius:50%;background:transparent;color:#2B2B2A;cursor:pointer}
.tag-x:hover{background:rgba(255,255,255,0.7)}
.fld{width:100%;border:0;border-bottom:1px dashed #DCDCD8;border-radius:6px 6px 0 0;background:transparent;font:inherit;color:#2B2B2A;padding:8px 6px}
.fld:hover{background:#F8F8F6}
.fld:focus{outline:none;background:#F4F4F2;border-bottom:1px solid #2B2B2A}
.fld::placeholder{color:#6B6B69}
textarea.fld{resize:none;line-height:1.6;display:block}
.add-tile{display:flex;align-items:center;justify-content:center;border:1.5px dashed #D9D9D5;border-radius:10px;background:transparent;color:#5E5E5B;font:inherit;cursor:pointer}
.add-tile:hover{border-color:#9C9C98;background:#FAFAF8;color:#2B2B2A}
.x{position:absolute;top:5px;right:5px;width:26px;height:26px;border:0;border-radius:50%;background:rgba(255,255,255,0.92);color:#2B2B2A;display:flex;align-items:center;justify-content:center;cursor:pointer}
.danger{color:#9B3D2E}
.danger:hover{background:#FBEDEA;color:#7E2E21}
.h2{margin:0;font-family:Caveat,cursive;font-weight:600;font-size:34px;line-height:1.1}
.tmr{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 14px;border:1px solid #E4E4E1;border-radius:999px;color:#2B2B2A;font:inherit;font-size:14px;font-variant-numeric:tabular-nums;cursor:pointer}
.tmr:hover{filter:brightness(0.97)}
.tmr-x{width:36px;height:36px;min-height:36px;padding:0;justify-content:center;border-radius:50%}
@keyframes tmrPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.tmr.ring{animation:tmrPulse .9s ease-in-out infinite;border-color:transparent}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:54px;padding:0 14px;border:0;border-radius:12px;background:transparent;font:inherit;font-size:16px;color:#2B2B2A;text-align:left;cursor:pointer}
.opt:hover{background:#F6F6F4}
.opt:focus-within{outline:2px solid #2B2B2A;outline-offset:-2px}
.opt-ic{width:40px;height:40px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{animation:sheetUp .24s cubic-bezier(.2,.7,.2,1)}
.scrim{animation:fadeIn .2s ease}
.num{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Caveat,cursive;font-size:22px;font-weight:700;color:#2B2B2A}
</style>
</helmet>
<div class="{{rootClass}}" style="min-height: 100vh; background: #FFFFFF; color: #2B2B2A; font-family: Inter, system-ui, sans-serif; font-size: 16px; line-height: 1.6">

<header class="zone" style="position: sticky; top: 0; z-index: 3; background: rgba(255,255,255,0.94)">
<sc-if value="{{viewing}}" hint-placeholder-val="{{ true }}">
<nav class="hov tch" aria-label="Навігація" style="max-width: 640px; margin: 0 auto; padding: 4px 8px; display: flex; align-items: center; justify-content: space-between">
<a class="ghost icon" href="Library.dc.html" aria-label="Усі рецепти">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
</a>
<div style="display: flex; align-items: center">
<button type="button" class="ghost icon" aria-label="Редагувати рецепт" onClick="{{startEdit}}">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"></path><path d="M13.5 6.5l4 4"></path></svg>
</button>
<button type="button" class="ghost icon" aria-label="Ще дії">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="5" cy="12" r="0.6"></circle><circle cx="12" cy="12" r="0.6"></circle><circle cx="19" cy="12" r="0.6"></circle></svg>
</button>
</div>
</nav>
</sc-if>
<sc-if value="{{editing}}" hint-placeholder-val="{{ false }}">
<nav aria-label="Редагування" style="max-width: 640px; margin: 0 auto; padding: 6px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #F0F0ED">
<span style="font-size: 14px; color: #5E5E5B">Редагування</span>
<button type="button" class="pill" onClick="{{finishEdit}}" style="background: {{accent}}">Готово</button>
</nav>
</sc-if>
</header>

<main style="max-width: 640px; margin: 0 auto; padding: 8px 20px 96px">

<sc-if value="{{viewing}}" hint-placeholder-val="{{ true }}">
<div style="display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: #5E5E5B">
<svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>
{{time}}
</div>
<h1 style="margin: 4px 0 8px; font-family: Caveat, cursive; font-weight: 600; font-size: clamp(46px, 12vw, 60px); line-height: 1.05">{{title}}</h1>
<p style="margin: 0; font-size: 17px; color: #5E5E5B">{{desc}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px">
<sc-for list="{{tags}}" as="t" hint-placeholder-count="3">
<span class="tag" style="background: {{t.bg}}">{{t.label}}</span>
</sc-for>
</div>
</sc-if>

<sc-if value="{{editing}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #5E5E5B">
<svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>
<label class="sr" for="f-time">Час приготування</label>
<input id="f-time" class="fld" type="text" value="{{time}}" onChange="{{setTime}}" placeholder="Час" style="width: 110px; padding: 2px 6px">
</div>
<label class="sr" for="f-title">Назва рецепта</label>
<input id="f-title" class="fld" type="text" value="{{title}}" onChange="{{setTitle}}" placeholder="Назва рецепта" style="margin-top: 4px; font-family: Caveat, cursive; font-weight: 600; font-size: clamp(46px, 12vw, 60px); line-height: 1.1; padding: 0 6px">
<label class="sr" for="f-desc">Короткий опис</label>
<textarea id="f-desc" class="fld" rows="3" value="{{desc}}" onChange="{{setDesc}}" placeholder="Кілька слів про страву" style="margin-top: 6px; font-size: 17px; color: #4A4A48"></textarea>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 14px">
<sc-for list="{{tags}}" as="t" hint-placeholder-count="3">
<span class="tag" style="background: {{t.bg}}">{{t.label}}<button type="button" class="tag-x" aria-label="{{t.removeLabel}}" onClick="{{t.remove}}"><svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></span>
</sc-for>
<label class="sr" for="f-tag">Новий тег</label>
<input id="f-tag" class="fld" type="text" value="{{tagDraft}}" onChange="{{setTagDraft}}" onKeyDown="{{tagKey}}" placeholder="+ тег" style="width: 96px; padding: 3px 8px; font-size: 13px">
</div>
</sc-if>

<section aria-label="Фото страви" style="margin-top: 24px">
<div style="width: 100%; aspect-ratio: 4 / 3; max-height: 440px; border-radius: 14px; background: {{heroTint}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #6B6B69; font-size: 14px">
<sc-if value="{{heroEmpty}}" hint-placeholder-val="{{ true }}">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M21 16l-5-5-8 8"></path></svg>
<span>{{heroLabel}}</span>
</sc-if>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px">
<sc-for list="{{photos}}" as="p" hint-placeholder-count="3">
<div class="zone" style="position: relative">
<button type="button" class="{{p.cls}}" aria-label="{{p.label}}" onClick="{{p.pick}}" style="background: {{p.tint}}"></button>
<sc-if value="{{editing}}" hint-placeholder-val="{{ false }}">
<button type="button" class="x hov tch" aria-label="{{p.removeLabel}}" onClick="{{p.remove}}"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</sc-if>
</div>
</sc-for>
<sc-if value="{{editing}}" hint-placeholder-val="{{ false }}">
<button type="button" class="add-tile" aria-label="Додати фото рецепта" onClick="{{openRecipeSheet}}" style="width: 64px; height: 64px">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
</button>
</sc-if>
</div>
</section>

<section class="zone" aria-labelledby="ing-h" style="margin-top: 48px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px">
<h2 id="ing-h" class="h2">Інгредієнти</h2>
<sc-if value="{{viewing}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #5E5E5B">
<button type="button" class="ghost round hov tch" aria-label="Менше порцій" onClick="{{less}}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 12h12"></path></svg></button>
<span style="min-width: 78px; text-align: center">{{servingsLabel}}</span>
<button type="button" class="ghost round hov tch" aria-label="Більше порцій" onClick="{{more}}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 12h12M12 6v12"></path></svg></button>
</div>
</sc-if>
<sc-if value="{{editing}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #5E5E5B">
<label for="f-serv">Порцій</label>
<input id="f-serv" class="fld" type="number" min="1" value="{{baseServings}}" onChange="{{setBase}}" style="width: 56px; text-align: center; padding: 4px">
</div>
</sc-if>
</div>

<sc-if value="{{viewing}}" hint-placeholder-val="{{ true }}">
<ul style="list-style: none; margin: 0 -8px; padding: 0">
<sc-for list="{{ingredients}}" as="item" hint-placeholder-count="8">
<li style="border-bottom: 1px solid #EFEFEC">
<button type="button" class="ing" onClick="{{item.toggle}}">
<span class="{{item.cls}}">{{item.name}}</span>
<span class="{{item.cls}}" style="flex-shrink: 0; color: #4A4A48; font-variant-numeric: tabular-nums">{{item.qtyView}}</span>
</button>
</li>
</sc-for>
</ul>
</sc-if>

<sc-if value="{{editing}}" hint-placeholder-val="{{ false }}">
<ul style="list-style: none; margin: 0; padding: 0">
<sc-for list="{{ingredients}}" as="item" hint-placeholder-count="8">
<li class="zone" style="display: grid; grid-template-columns: 24px minmax(0, 1fr) 92px 36px; align-items: center; gap: 4px; margin-left: -10px">
<button type="button" class="ghost hov tch" aria-label="Перетягнути, щоб змінити порядок" style="width: 24px; min-height: 36px; padding: 0; justify-content: center; cursor: grab"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"></circle><circle cx="15" cy="6" r="1.6"></circle><circle cx="9" cy="12" r="1.6"></circle><circle cx="15" cy="12" r="1.6"></circle><circle cx="9" cy="18" r="1.6"></circle><circle cx="15" cy="18" r="1.6"></circle></svg></button>
<label class="sr" for="{{item.nameId}}">Інгредієнт</label>
<input id="{{item.nameId}}" class="fld" type="text" value="{{item.name}}" onChange="{{item.setName}}" placeholder="Інгредієнт">
<label class="sr" for="{{item.qtyId}}">Кількість</label>
<input id="{{item.qtyId}}" class="fld" type="text" value="{{item.qty}}" onChange="{{item.setQty}}" placeholder="500 г" style="text-align: right; color: #4A4A48">
<button type="button" class="ghost hov tch" aria-label="Видалити інгредієнт" onClick="{{item.remove}}" style="width: 36px; min-height: 36px; padding: 0; justify-content: center"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</li>
</sc-for>
</ul>
<button type="button" class="ghost" onClick="{{addIngredient}}" style="margin-top: 6px; margin-left: -12px">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
Додати інгредієнт
</button>
</sc-if>
</section>

<section aria-labelledby="steps-h" style="margin-top: 48px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px">
<h2 id="steps-h" class="h2">Приготування</h2>
<sc-if value="{{viewing}}" hint-placeholder-val="{{ true }}">
<a class="ghost" href="Cook.dc.html" style="padding: 0 14px; border-radius: 999px; background: {{accent}}; color: #2B2B2A">
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l10-6.5z"></path></svg>
Готувати
</a>
</sc-if>
</div>

<sc-if value="{{viewing}}" hint-placeholder-val="{{ true }}">
<ol style="list-style: none; margin: 0; padding: 0">
<sc-for list="{{steps}}" as="st" hint-placeholder-count="6">
<li style="display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 14px; padding: 18px 0; border-bottom: 1px solid #EFEFEC">
<div class="num" aria-hidden="true" style="background: {{accent}}">{{st.num}}</div>
<div style="min-width: 0">
<p style="margin: 3px 0 0">{{st.text}}</p>
<sc-if value="{{st.tm.has}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 4px; margin-top: 10px">
<button type="button" class="{{st.tm.cls}}" aria-label="{{st.tm.label}}" onClick="{{st.tm.main}}" style="background: {{st.tm.bg}}">
<sc-if value="{{st.tm.showPlay}}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12.5-7.5z"></path></svg></sc-if>
<sc-if value="{{st.tm.showPause}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z"></path></svg></sc-if>
<sc-if value="{{st.tm.showBell}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 20.5a2 2 0 0 0 4 0"></path></svg></sc-if>
<span>{{st.tm.text}}</span>
</button>
<sc-if value="{{st.tm.canReset}}" hint-placeholder-val="{{ false }}">
<button type="button" class="ghost tmr-x" aria-label="Скинути таймер" onClick="{{st.tm.reset}}"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5"></path><path d="M4.5 4v4h4"></path></svg></button>
</sc-if>
<span class="sr" aria-live="assertive">{{st.tm.live}}</span>
</div>
</sc-if>
<sc-if value="{{st.hasPhotos}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px">
<sc-for list="{{st.photos}}" as="sp" hint-placeholder-count="1">
<button type="button" class="{{sp.cls}}" aria-label="{{sp.label}}" aria-pressed="{{sp.pressed}}" onClick="{{sp.toggle}}" style="background: {{sp.tint}}"></button>
</sc-for>
</div>
</sc-if>
</div>
</li>
</sc-for>
</ol>
</sc-if>

<sc-if value="{{editing}}" hint-placeholder-val="{{ false }}">
<ol style="list-style: none; margin: 0; padding: 0">
<sc-for list="{{steps}}" as="st" hint-placeholder-count="6">
<li class="zone" style="position: relative; display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; padding: 16px 0; border-bottom: 1px solid #EFEFEC">
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<div class="num" aria-hidden="true" style="background: {{accent}}">{{st.num}}</div>
<button type="button" class="ghost hov tch" aria-label="Перетягнути, щоб змінити порядок" style="width: 32px; min-height: 36px; padding: 0; justify-content: center; cursor: grab"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"></circle><circle cx="15" cy="6" r="1.6"></circle><circle cx="9" cy="12" r="1.6"></circle><circle cx="15" cy="12" r="1.6"></circle><circle cx="9" cy="18" r="1.6"></circle><circle cx="15" cy="18" r="1.6"></circle></svg></button>
<button type="button" class="ghost hov tch" aria-label="Видалити крок" onClick="{{st.remove}}" style="width: 32px; min-height: 36px; padding: 0; justify-content: center"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"></path></svg></button>
</div>
<div style="min-width: 0">
<label class="sr" for="{{st.textId}}">Опис кроку</label>
<textarea id="{{st.textId}}" class="fld" rows="3" value="{{st.text}}" onChange="{{st.setText}}" placeholder="Опишіть крок"></textarea>
<div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px">
<sc-for list="{{st.photos}}" as="sp" hint-placeholder-count="1">
<div class="zone" style="position: relative; width: 104px; height: 78px; border-radius: 10px; background: {{sp.tint}}">
<button type="button" class="x hov tch" aria-label="Видалити фото кроку" onClick="{{sp.remove}}"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
</sc-for>
