<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Усі рецепти</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#2B2B2A}a:hover{color:#1F1F1E}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hov{opacity:0;transition:opacity .18s ease}
@media (hover:hover){.zone:hover .hov{opacity:1}}
@media (hover:none){.tch{opacity:1}}
.zone:focus-within .hov,.reveal .hov,.open .hov{opacity:1}
.ghost{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:#5E5E5B;font:inherit;font-size:14px;text-decoration:none;cursor:pointer}
.ghost:hover{background:#F2F2F0;color:#1F1F1E}
.row{display:flex;align-items:center;gap:14px;padding:10px 8px;border-radius:12px;text-decoration:none}
.row:hover{background:#F7F7F5}
.row .arrow{opacity:0;transition:opacity .18s ease}
.row:hover .arrow,.row:focus .arrow{opacity:1}
.search{width:100%;border:0;border-radius:10px;background:#F6F6F4;font:inherit;font-size:15px;color:#2B2B2A;padding:10px 12px 10px 38px}
.search:focus{outline:none;background:#F0F0EE}
.search::placeholder{color:#6B6B69}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:2px 20px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;min-height:32px;padding:0 12px;border:1px solid #E6E6E3;border-radius:999px;background:#FFFFFF;color:#4A4A48;font:inherit;font-size:13px;cursor:pointer}
.chip:hover{background:#F6F6F4}
.chip.on{border-color:transparent;color:#2B2B2A}
</style>
</helmet>
<div class="{{rootClass}}" style="min-height: 100vh; background: #FFFFFF; color: #2B2B2A; font-family: Inter, system-ui, sans-serif; font-size: 16px; line-height: 1.6">

<main style="max-width: 640px; margin: 0 auto; padding: 28px 20px 96px">

<div class="zone {{headCls}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<h1 style="margin: 0; font-family: Caveat, cursive; font-weight: 600; font-size: 52px; line-height: 1.1">Рецепти</h1>
<div style="position: relative; display: flex; align-items: center; gap: 2px">
<a class="ghost hov tch" href="Main.dc.html" aria-label="Новий рецепт" style="width: 44px; padding: 0; justify-content: center">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
</a>
<button type="button" class="ghost hov tch" aria-label="Обліковий запис" aria-expanded="{{menuExpanded}}" onClick="{{toggleMenu}}" style="width: 44px; padding: 0; justify-content: center">
<span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 50%; background: #DDD7F0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #2B2B2A">ІП</span>
</button>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
<button type="button" aria-label="Закрити меню" onClick="{{closeMenu}}" style="position: fixed; inset: 0; z-index: 4; border: 0; background: transparent; cursor: default"></button>
<div style="position: absolute; right: 0; top: 50px; z-index: 5; width: 240px; padding: 6px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 10px 30px rgba(0,0,0,0.08), 0 0 0 1px #EFEFEC; text-align: left">
<div style="padding: 8px 10px 10px">
<div style="font-size: 15px; font-weight: 500">Ім'я Прізвище</div>
<div style="font-size: 13px; color: #5E5E5B">you@gmail.com</div>
</div>
<div style="height: 1px; margin: 0 6px 4px; background: #F0F0ED"></div>
<a class="ghost" href="Login.dc.html" style="display: flex; width: 100%; color: #2B2B2A">
<svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"></path><path d="M15 16l4-4-4-4"></path><path d="M19 12H9"></path></svg>
Вийти
</a>
</div>
</sc-if>
</div>
</div>

<div style="position: relative; margin: 12px 0 10px">
<svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6B6B69" stroke-width="1.6" stroke-linecap="round" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%)"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4-4"></path></svg>
<label class="sr" for="q">Пошук рецептів</label>
<input id="q" class="search" type="search" placeholder="Пошук" value="{{query}}" onChange="{{setQuery}}">
</div>

<div class="chips" role="group" aria-label="Фільтр за тегами">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
<button type="button" class="{{c.cls}}" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="background: {{c.bg}}">{{c.label}}</button>
</sc-for>
</div>

<ul style="list-style: none; margin: 12px -8px 0; padding: 0; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{recipes}}" as="r" hint-placeholder-count="7">
<li>
<a class="row" href="Main.dc.html">
<div aria-hidden="true" style="flex-shrink: 0; width: 52px; height: 52px; border-radius: 10px; background: {{r.tint}}"></div>
<div style="flex: 1; min-width: 0">
<div style="font-family: Caveat, cursive; font-weight: 600; font-size: 27px; line-height: 1.1">{{r.title}}</div>
<div style="font-size: 13px; color: #5E5E5B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.meta}}</div>
</div>
<svg class="arrow" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E5E5B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
</a>
</li>
</sc-for>
</ul>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<p style="margin: 24px 0; color: #5E5E5B">Нічого не знайдено.</p>
</sc-if>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"revealAll":{"editor":"boolean","default":false},"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { query: '', tag: null, menu: false };
  }
  renderVals() {
    var self = this;
    var tagTints = ['#D6E6D9', '#F5DCCD', '#DDD7F0', '#F3E7B8', '#D3E3EE'];
    var all = [
      ['Сирники', '30 хв', ['сніданок', 'вегетаріанське', 'на сковороді'], '#F1EEE9'],
      ['Борщ', '2 год', ['суп', 'на свято'], '#F3E6E2'],
      ['Вареники з картоплею', '1,5 год', ['вегетаріанське', 'на свято'], '#F3F3F1'],
      ['Деруни', '40 хв', ['вегетаріанське', 'на сковороді'], '#F3ECE6'],
      ['Гречка з грибами', '35 хв', ['вегетаріанське', 'швидко'], '#EEEBE6'],
      ['Яблучна шарлотка', '1 год', ['випічка', 'десерт'], '#F5EFDF'],
      ['Узвар', '30 хв', ['напої', 'на свято'], '#EAF0EA']
    ];
    var allTags = [];
    all.forEach(function (r) { r[2].forEach(function (t) { if (allTags.indexOf(t) === -1) allTags.push(t); }); });
    var cur = this.state.tag;
    var chips = allTags.map(function (t, i) {
      var on = cur === t;
      return {
        label: t,
        cls: 'chip' + (on ? ' on' : ''),
        pressed: on ? 'true' : 'false',
        bg: on ? tagTints[i % tagTints.length] : '#FFFFFF',
        pick: function () { self.setState({ tag: on ? null : t }); }
      };
    });
    var q = this.state.query.trim().toLowerCase();
    var recipes = all.filter(function (r) {
      if (cur && r[2].indexOf(cur) === -1) return false;
      if (!q) return true;
      return r[0].toLowerCase().indexOf(q) !== -1 || r[2].join(' ').indexOf(q) !== -1;
    }).map(function (r) { return { title: r[0], meta: r[1] + ' · ' + r[2].join(', '), tint: r[3] }; });
    return {
      rootClass: (this.props.revealAll ?? false) ? 'reveal' : '',
      menuOpen: this.state.menu,
      menuExpanded: this.state.menu ? 'true' : 'false',
      headCls: this.state.menu ? 'open' : '',
      toggleMenu: function () { self.setState({ menu: !self.state.menu }); },
      closeMenu: function () { self.setState({ menu: false }); },
      query: this.state.query,
      setQuery: function (e) { self.setState({ query: e.target.value }); },
      chips: chips,
      recipes: recipes,
      empty: recipes.length === 0
    };
  }
}
</script>
</body>
</html>
