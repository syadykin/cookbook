openapi: 3.0.3
info:
  title: Recipes API
  version: 0.1.0
  description: |
    Чернетка API для застосунку «Рецепти». Автентифікація — лише Google (OAuth 2.0 / OpenID Connect),
    сесія в HttpOnly cookie. Усі ресурси належать поточному користувачу.
servers:
  - url: /api
security:
  - session: []

tags:
  - name: auth
  - name: recipes
  - name: tags
  - name: photos

paths:
  /auth/google/login:
    get:
      tags: [auth]
      summary: Редірект на сторінку входу Google
      security: []
      parameters:
        - name: return_to
          in: query
          schema: { type: string }
          description: Відносний шлях, куди повернутися після входу.
      responses:
        "302": { description: Редірект на accounts.google.com }

  /auth/google/callback:
    get:
      tags: [auth]
      summary: Callback від Google; створює користувача (за потреби) і сесію
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        "302": { description: Встановлює cookie сесії й редіректить на return_to або / }
        "400": { $ref: "#/components/responses/Error" }

  /auth/logout:
    post:
      tags: [auth]
      summary: Вихід — видаляє сесію
      responses:
        "204": { description: OK, cookie очищено }

  /me:
    get:
      tags: [auth]
      summary: Поточний користувач
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }

  /recipes:
    get:
      tags: [recipes]
      summary: Список рецептів (для екрана «Усі рецепти»)
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: Пошук у назві та тегах (без урахування регістру).
        - name: tag
          in: query
          schema: { type: string }
          description: Фільтр за одним тегом.
      responses:
        "200":
          description: OK, відсортовано за updated_at desc
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RecipeSummary" }
    post:
      tags: [recipes]
      summary: Створити рецепт (новий рецепт відкривається одразу в режимі редагування)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipeInput" }
      responses:
        "201":
          description: Створено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        "422": { $ref: "#/components/responses/Error" }

  /recipes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [recipes]
      summary: Повний рецепт
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [recipes]
      summary: Зберегти рецепт цілком (кнопка «Готово» в режимі редагування)
      description: |
        Замінює поля, теги, інгредієнти, кроки і порядок фото. Порядок елементів у масивах = порядок на екрані.
        Елементи без id створюються, з id — оновлюються, відсутні — видаляються.
        Для захисту від перезапису передавайте заголовок If-Match з полем version.
      parameters:
        - name: If-Match
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipeInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        "404": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [recipes]
      summary: Видалити рецепт
      responses:
        "204": { description: Видалено }
        "404": { $ref: "#/components/responses/Error" }

  /tags:
    get:
      tags: [tags]
      summary: Усі теги користувача (рядок фільтрів у списку, підказки при вводі)
      responses:
        "200":
          description: OK, за частотою використання
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TagCount" }

  /photos:
    post:
      tags: [photos]
      summary: Завантажити фото (з камери або галереї)
      description: |
        Сервер перевіряє тип, знімає EXIF (у т.ч. геолокацію), повертає з урахуванням орієнтації,
        зменшує до 2048 px по довшій стороні й зберігає. Фото прив'язується до рецепта/кроку через PUT /recipes/{id}.
        Неприв'язані фото старші за 24 год видаляються фоновою задачею.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Завантажено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Photo" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }

  /photos/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [photos]
      summary: Файл зображення
      parameters:
        - name: w
          in: query
          schema: { type: integer, enum: [160, 640, 1280, 2048] }
          description: Ширина варіанта (мініатюри 160, кроки 640, обкладинка 1280).
      responses:
        "200":
          description: Зображення
          content:
            image/jpeg: {}
            image/webp: {}
        "404": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: session

  responses:
    Error:
      description: Помилка
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: not_found }
        message: { type: string }

    User:
      type: object
      required: [id, email, name]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        name: { type: string }
        avatarUrl: { type: string, nullable: true }

    Photo:
      type: object
      required: [id, url, width, height]
      properties:
        id: { type: string }
        url: { type: string, example: /api/photos/01JD3K... }
        width: { type: integer }
        height: { type: integer }

    TagCount:
      type: object
      required: [name, count]
      properties:
        name: { type: string }
        count: { type: integer }

    Ingredient:
      type: object
      required: [name, quantity]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: "Кисломолочний сир, 9%" }
        quantity:
          type: string
          example: "500 г"
          description: Вільний текст. Якщо починається з числа (кома або крапка), клієнт масштабує його за порціями.

    Step:
      type: object
      required: [text, photos]
      properties:
        id: { type: integer, format: int64 }
        text: { type: string }
        timerSeconds:
          type: integer
          nullable: true
          minimum: 1
          description: Якщо задано — на кроці показується кнопка таймера.
        photos:
          type: array
          items: { $ref: "#/components/schemas/Photo" }

    RecipeSummary:
      type: object
      required: [id, title, timeText, tags, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        timeText: { type: string }
        tags: { type: array, items: { type: string } }
        cover: { $ref: "#/components/schemas/Photo" }
        updatedAt: { type: string, format: date-time }

    Recipe:
      type: object
      required: [id, version, title, description, timeText, servings, tags, photos, ingredients, steps, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        version: { type: string, description: ETag для If-Match }
        title: { type: string }
        description: { type: string }
        timeText: { type: string, example: "30 хв" }
        servings: { type: integer, minimum: 1 }
        tags: { type: array, items: { type: string } }
        photos:
          type: array
          description: Перше фото — обкладинка.
          items: { $ref: "#/components/schemas/Photo" }
        ingredients:
          type: array
          items: { $ref: "#/components/schemas/Ingredient" }
        steps:
          type: array
          items: { $ref: "#/components/schemas/Step" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    StepInput:
      type: object
      required: [text, photoIds]
      properties:
        id: { type: integer, format: int64 }
        text: { type: string }
        timerSeconds: { type: integer, nullable: true, minimum: 1 }
        photoIds: { type: array, items: { type: string } }

    RecipeInput:
      type: object
      required: [title, description, timeText, servings, tags, photoIds, ingredients, steps]
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        timeText: { type: string, maxLength: 40 }
        servings: { type: integer, minimum: 1, maximum: 99 }
        tags:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 40 }
        photoIds: { type: array, items: { type: string } }
        ingredients:
          type: array
          items: { $ref: "#/components/schemas/Ingredient" }
        steps:
          type: array
          items: { $ref: "#/components/schemas/StepInput" }
