name: CI

on:
  push:
  pull_request:
  # lets the release workflow run the same checks before it publishes an image
  workflow_call:

# a newer push to the same branch makes an older run pointless
concurrency:
  group: ci-${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  test:
    name: Lint, build and e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            e2e/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pillow
          npm ci --prefix ui
          npm ci --prefix e2e

      - name: Lint UI
        working-directory: ui
        run: |
          npm run schema
          npm run lint

      # make e2e builds ui/dist (tsc + vite) and the Go binary, then runs the API checks and the
      # browser walkthrough; ubuntu-latest ships Google Chrome at /usr/bin/google-chrome
      - name: Build and run e2e
        env:
          E2E_WORK: ${{ runner.temp }}/e2e
        run: make e2e

      - name: Keep screenshots and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ github.run_id }}
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore
          retention-days: 7
