name: Publish Docker image

# A push to main publishes the image as latest. A published GitHub release (not a draft) publishes
# it under its version only and leaves latest alone: the release's tag must be a semver such as
# v1.2.3, and the image gets 1.2.3 and 1.2 (a pre-release such as v1.2.3-rc1 gets just 1.2.3-rc1).
#
# Requires, under Settings -> Secrets and variables -> Actions:
#   variable DOCKERHUB_REPOSITORY - target repository, e.g. syadykin/cookbook
#   secret   DOCKERHUB_USERNAME   - Docker Hub account name
#   secret   DOCKERHUB_TOKEN      - Docker Hub access token with write permission

on:
  push:
    branches: [main]
  release:
    types: [published]

# runs that finish out of order must not leave an older main build as latest
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Build and push to Docker Hub
    # an image is only published for a commit that passes the full check
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check the target repository is configured
        env:
          REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
        run: |
          if [ -z "$REPOSITORY" ]; then
            echo "::error::DOCKERHUB_REPOSITORY variable is not set, e.g. syadykin/cookbook"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_REPOSITORY }}
          # latest comes only from main; without latest=false a release would move it too
          flavor: |
            latest=false
          # the semver tags apply only to releases, the raw one only to pushes to main
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # npm install and the go build dominate the run, so their layers are worth keeping
          cache-from: type=gha
          cache-to: type=gha,mode=max
