openapi: 3.0.4
info:
  title: Їжак з макітрою (cookbook) API
  version: "1.0"
  description: |
    API of «Їжак з макітрою», a personal recipe book. Sign-in is through Google (OAuth 2.0 / OpenID
    Connect) or, for development, as a local user from the configuration. The session is a random
    token in an HttpOnly cookie. Every resource belongs to the current user.
servers:
  - url: /api
security:
  - session: []

tags:
  - name: auth
  - name: recipes
  - name: tags
  - name: photos

paths:
  /auth/providers:
    get:
      operationId: auth.providers
      tags: [auth]
      summary: Available sign-in providers
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuthProvider" }

  /auth/{provider}/login:
    get:
      operationId: auth.login
      tags: [auth]
      summary: Start signing in — redirect to the provider
      security: []
      parameters:
        - $ref: "#/components/parameters/Provider"
        - name: return_to
          in: query
          description: App-relative path to return to after signing in.
          schema: { type: string, maxLength: 2048 }
      responses:
        "302":
          description: Redirect to the provider
          headers:
            Location: { required: true, schema: { type: string } }
        "404": { $ref: "#/components/responses/Error" }

  /auth/{provider}/callback:
    get:
      operationId: auth.callback
      tags: [auth]
      summary: Provider callback; creates the user (if new) and a session
      description: Query parameters (code, state, error…) depend on the provider.
      security: []
      parameters:
        - $ref: "#/components/parameters/Provider"
      responses:
        "302":
          description: Sets the session cookie and redirects to return_to or the app root
          headers:
            Location: { required: true, schema: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /auth/logout:
    post:
      operationId: auth.logout
      tags: [auth]
      summary: Sign out — deletes the session
      security: []
      responses:
        "204": { description: OK, cookie cleared }

  /me:
    get:
      operationId: auth.me
      tags: [auth]
      summary: Current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }

  /recipes:
    get:
      operationId: recipes.list
      tags: [recipes]
      summary: List recipes
      parameters:
        - name: q
          in: query
          description: Search in titles and tags (case-insensitive, by word prefix).
          schema: { type: string, maxLength: 200 }
        - name: tag
          in: query
          description: Filter by a single tag.
          schema: { type: string, maxLength: 40 }
        - name: limit
          in: query
          description: Page size.
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
        - name: cursor
          in: query
          description: >-
            `nextCursor` of the previous page; omit for the first one. Pages are keyed by the last
            row rather than by offset, so a recipe saved meanwhile (which moves to the top) causes
            neither repeats nor gaps.
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: OK, sorted by updatedAt desc
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecipePage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: recipes.create
      tags: [recipes]
      summary: Create a recipe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Recipe" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /recipes/{id}:
    parameters:
      - $ref: "#/components/parameters/RecipeId"
    get:
      operationId: recipes.get
      tags: [recipes]
      summary: Get a recipe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: recipes.update
      tags: [recipes]
      summary: Save a whole recipe
      description: |
        Replaces fields, tags, ingredient groups, steps and photos. Array order is display order.
        Ingredient groups, ingredients and steps with an id are updated, without one are created,
        and missing ones are deleted; an ingredient may move to another group of the same recipe.
        Groups without ingredients are dropped. At most 200 ingredients across all groups (422). Photos are referenced by id (read-only fields are ignored); photos removed from the
        recipe are deleted later by a background job.
      parameters:
        - name: If-Match
          in: header
          required: true
          description: The version of the recipe that was edited.
          schema: { type: string, pattern: '^"?[0-9]+"?$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Recipe" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: recipes.delete
      tags: [recipes]
      summary: Delete a recipe
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /recipes/{id}/pdf:
    parameters:
      - $ref: "#/components/parameters/RecipeId"
    get:
      operationId: recipes.pdf
      tags: [recipes]
      summary: The recipe as an A4 PDF, for download
      description: |
        Title, time, description, the cover photo, ingredients (for the recipe's own servings),
        steps with their timers and notes. Tags and step photos are left out.
      responses:
        "200":
          description: PDF file
          headers:
            Content-Disposition:
              required: true
              description: attachment, named after the recipe title
              schema: { type: string }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /tags:
    get:
      operationId: tags.list
      tags: [tags]
      summary: All of the user's tags
      responses:
        "200":
          description: OK, most used first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TagCount" }
        "401": { $ref: "#/components/responses/Error" }

  /photos:
    post:
      operationId: photos.upload
      tags: [photos]
      summary: Upload a photo
      description: |
        The server checks the type by content (JPEG, PNG, WebP, GIF), applies the EXIF orientation,
        strips metadata, scales down to 2048 px on the longer side and prepares 160/640/1280 variants.
        A photo is attached to a recipe or step through PUT /recipes/{id}; unattached photos older
        than 24 hours are deleted.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Photo" }
        "401": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }

  /photos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: "^[0-9A-Za-z]{1,32}$" }
    get:
      operationId: photos.get
      tags: [photos]
      summary: Image file
      parameters:
        - name: w
          in: query
          description: Variant width (thumbnails 160, steps 640, cover 1280, original 2048).
          schema: { type: integer, enum: [160, 640, 1280, 2048], default: 1280 }
      responses:
        "200":
          description: Image
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: session

  parameters:
    Provider:
      name: provider
      in: path
      required: true
      schema: { type: string, enum: [google, local] }
    RecipeId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code.
          example: not_found
        message:
          type: string
          description: Human-readable message.
        fields:
          type: object
          description: Validation errors by field path (e.g. `steps.2.text`).
          additionalProperties:
            type: array
            items: { type: string }

    AuthProvider:
      type: object
      required: [name, title, url, autoSubmit]
      properties:
        name: { type: string, example: google }
        title: { type: string, example: Увійти через Google }
        url:
          type: string
          description: URL that starts signing in (without return_to).
          example: /api/auth/google/login
        autoSubmit:
          type: boolean
          description: When this is the only provider, sign in automatically without showing a button.

    User:
      type: object
      required: [id, email, name]
      properties:
        id: { type: integer, format: int64, readOnly: true }
        email: { type: string, format: email }
        name: { type: string }
        avatarUrl: { type: string, nullable: true }

    Photo:
      type: object
      description: |
        The file is served at /api/photos/{id}?w=…; requests need only the id, the other fields are read-only.
      required: [id, width, height]
      properties:
        id: { type: string, pattern: "^[0-9A-Za-z]{1,32}$" }
        width: { type: integer, readOnly: true, description: Width of the largest variant }
        height: { type: integer, readOnly: true }

    RecipePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RecipeSummary" }
        nextCursor:
          type: string
          description: Pass as `cursor` to get the next page; absent on the last page.

    TagCount:
      type: object
      required: [name, count]
      properties:
        name: { type: string }
        count: { type: integer }

    Ingredient:
      type: object
      required: [name, quantity]
      properties:
        id:
          type: integer
          format: int64
          description: Absent for a new ingredient.
        name:
          type: string
          maxLength: 200
          example: "Кисломолочний сир, 9%"
        quantity:
          type: string
          maxLength: 40
          example: "500 г"
          description: Free text. If it starts with a number (comma or dot decimal), the client scales it by servings.

    IngredientGroup:
      type: object
      required: [name, ingredients]
      description: Ingredients for one part of the dish (dough, filling…).
      properties:
        id:
          type: integer
          format: int64
          description: Absent for a new group.
        name:
          type: string
          maxLength: 100
          example: "Тісто"
          description: Optional; the client numbers unnamed groups when there is more than one.
        ingredients:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/Ingredient" }

    Step:
      type: object
      required: [text, photos]
      properties:
        id:
          type: integer
          format: int64
          description: Absent for a new step. Stable across saves (timers are keyed by it).
        text: { type: string, maxLength: 5000 }
        timerSeconds:
          type: integer
          nullable: true
          minimum: 1
          maximum: 86400
          description: When set, the step shows a timer button.
        photos:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/Photo" }

    Recipe:
      type: object
      description: One type for reading and writing; the server ignores readOnly fields.
      required: [id, version, title, description, timeText, servings, tags, photos, ingredientGroups, steps, notes, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64, readOnly: true }
        version:
          type: integer
          format: int64
          readOnly: true
          description: Change counter; sent in If-Match when saving.
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        timeText:
          type: string
          maxLength: 40
          example: "30 хв"
        servings:
          type: integer
          minimum: 0
          maximum: 99
          default: 4
          description: >-
            Servings the ingredient quantities are written for; 0 when they are not counted in
            servings (a sauce, a dough): the client then scales them by a multiplier instead.
        tags:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 40
            description: Lowercase, no duplicates (the server normalises them).
        photos:
          type: array
          maxItems: 20
          description: The first photo is the cover.
          items: { $ref: "#/components/schemas/Photo" }
        ingredientGroups:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/IngredientGroup" }
        steps:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/Step" }
        notes:
          type: string
          maxLength: 5000
          description: Free-form notes shown after the steps. Plain text; line breaks are kept.
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }

    RecipeSummary:
      type: object
      required: [id, title, description, timeText, tags, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        description: { type: string, description: Short description of the dish (may be empty). }
        timeText: { type: string }
        tags: { type: array, items: { type: string } }
        cover: { $ref: "#/components/schemas/Photo" }
        updatedAt: { type: string, format: date-time }
